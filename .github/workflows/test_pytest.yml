name: Test Pytest

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project
        run: uv sync --extra test

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false

  # The package itself has no dependencies: it must import and decide without numpy or mpi4py.
  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install without extras
        run: |
          uv venv
          uv pip install .

      - name: Import, decide and run the command
        run: |
          .venv/bin/python -c "import maybempi, sys; assert maybempi.is_serial(maybempi.get_mpi()); assert 'numpy' not in sys.modules and 'mpi4py' not in sys.modules"
          .venv/bin/maybempi --init

  # Real MPI: the tests in src/maybempi/tests/mpi under mpiexec, with two MPI implementations.
  mpi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mpi: ["openmpi", "mpich"]

    steps:
      - uses: actions/checkout@v4

      - uses: mpi4py/setup-mpi@v1
        with:
          mpi: ${{ matrix.mpi }}

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project with mpi4py built against ${{ matrix.mpi }}
        run: |
          uv sync --extra test
          uv pip install --no-binary mpi4py mpi4py

      - name: Unit tests, including the mpi4py comparison and mpiexec from Python
        run: .venv/bin/python -m pytest -q src/maybempi/tests

      - name: Tests under mpiexec -n 2
        run: |
          if [ "${{ matrix.mpi }}" = "openmpi" ]; then OVERSUBSCRIBE=--oversubscribe; fi
          mpiexec -n 2 $OVERSUBSCRIBE .venv/bin/python -m pytest -q -p no:cacheprovider src/maybempi/tests/mpi
          mpiexec -n 2 $OVERSUBSCRIBE .venv/bin/maybempi --init
