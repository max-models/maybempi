[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools", "wheel" ]

[project]
name = "maybempi"
version = "0.1.0"
description = "Use MPI only when launched under MPI, and a serial stand-in for mpi4py otherwise."
readme = "README.md"
keywords = [ "hpc", "mpi", "mpi4py", "parallel", "serial", "slurm" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = []

optional-dependencies.dev = [
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "maybempi[test,docs]",
]
optional-dependencies.docs = [
  "griffe",
  "ipykernel",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "numpy",
]
optional-dependencies.mpi = [ "mpi4py" ]
optional-dependencies.test = [ "numpy", "pytest", "pytest-cov" ]
urls."Documentation" = "https://max-models.github.io/maybempi/"
urls."Source" = "https://github.com/max-models/maybempi"
urls."Changelog" = "https://github.com/max-models/maybempi/blob/main/CHANGELOG.md"
scripts.maybempi = "maybempi.cli:main"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
"*" = [ "py.typed" ]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = [ "*.ipynb" ]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and pydocstyle
select = [ "B", "D", "E", "F", "I", "UP", "W" ]
ignore = [ "E501" ] # line length is handled by the formatter
pydocstyle.convention = "google"
per-file-ignores."**/tests/**" = [ "D" ]
per-file-ignores."*.ipynb" = [ "D" ]
per-file-ignores."docs/tools/*" = [ "D" ]

[tool.pyright]
include = [ "src" ]
exclude = [ "**/tests" ]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = [ "src" ]
testpaths = [ "src" ]
addopts = "-ra"

[tool.coverage.run]
source = [ "maybempi" ]
omit = [ "*/tests/*" ]

[tool.coverage.report]
show_missing = true
